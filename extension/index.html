<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Depthyum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="layer">
      <p id="layer-name">Nessun layer</p>
      <p id="layer-meta">Seleziona un layer video nella composizione.</p>
    </div>

    <form id="opts" onsubmit="return false">
      <label>Modello
        <select id="model">
          <option value="small">Small, veloce (Apache 2.0)</option>
          <option value="base">Base (uso non commerciale)</option>
          <option value="large">Large, più preciso (uso non commerciale)</option>
        </select>
      </label>

      <label>Risoluzione di analisi
        <select id="size">
          <option value="364">364 px, bozza</option>
          <option value="518" selected>518 px, standard</option>
          <option value="756">756 px, dettaglio</option>
          <option value="1036">1036 px, massimo</option>
        </select>
      </label>

      <label>Estremi di normalizzazione
        <select id="range">
          <option value="smooth">Stabilizzati nel tempo</option>
          <option value="shot">Fissi per inquadratura</option>
          <option value="frame">Per ogni frame</option>
        </select>
      </label>

      <label class="range">Fluidità temporale
        <output id="smooth-out">50%</output>
        <input id="smooth" type="range" min="0" max="90" step="5" value="50">
      </label>

      <label class="check">
        <input id="invert" type="checkbox">
        Vicino scuro, lontano chiaro
      </label>
    </form>

    <div id="run">
      <button id="go" type="button" disabled>Genera depth map</button>
      <button id="stop" type="button" hidden>Annulla</button>
      <progress id="bar" value="0" max="1" hidden></progress>
      <p id="msg" role="status"></p>
    </div>

    <details id="settings">
      <summary>Impostazioni</summary>
      <label>Python del motore
        <input id="python" type="text" spellcheck="false" placeholder="predefinito: engine/.venv">
      </label>
      <label>Cartella di output
        <input id="outroot" type="text" spellcheck="false" placeholder="predefinita: accanto al progetto">
      </label>
    </details>

    <p id="engine"></p>
  </main>

  <script src="cep.js"></script>
  <script src="lib.js"></script>
  <script src="main.js"></script>
</body>
</html>
